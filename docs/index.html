<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>Исследование ввода текста</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #fff;
        color: #111;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overscroll-behavior: none;
      }

      main {
        position: fixed;
        top: 0;
        right: 0;
        left: 0;
        height: var(--visual-viewport-height, 100dvh);
        overflow: hidden;
        background: #fff;
        transform: translate3d(0, var(--visual-viewport-top, 0), 0);
        will-change: transform, height;
      }

      .instructions {
        position: absolute;
        inset: 0 0 72px;
        overflow-y: auto;
        padding: 20px 20px 0;
        color: #000;
        font-size: 20px;
        line-height: 1.4;
        -webkit-overflow-scrolling: touch;
      }

      ol {
        margin: 0;
        padding-left: 24px;
      }

      li {
        margin-bottom: 19px;
      }

      li:last-child {
        margin-bottom: 0;
      }

      .input-area {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        padding: 12px 16px max(12px, env(safe-area-inset-bottom));
        background: #fff;
      }

      .input-shell {
        position: relative;
      }

      input {
        display: block;
        width: 100%;
        height: 48px;
        margin: 0;
        padding: 0 48px 0 16px;
        border: 1px solid #e6e6e6;
        border-radius: 12px;
        outline: none;
        appearance: none;
        background: #f3f3f3;
        color: #111;
        font: inherit;
        font-size: 16px;
      }

      input::placeholder {
        color: #8d8d8d;
      }

      input:focus {
        border-color: #d1d1d1;
        background: #f1f1f1;
      }

      button {
        position: absolute;
        top: 50%;
        right: 8px;
        display: grid;
        width: 32px;
        height: 32px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #5f5f5f;
        font: inherit;
        font-size: 26px;
        line-height: 1;
        place-items: center;
        transform: translateY(-50%);
        cursor: pointer;
      }

      button:disabled {
        color: #b8b8b8;
        cursor: default;
      }

      button:focus-visible {
        outline: 2px solid #767676;
        outline-offset: 1px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="instructions" aria-label="Инструкции">
        <ol>
          <li>Короткое сообщение другу о погоде</li>
          <li>Привет как дела</li>
          <li>Слево парк и дом</li>
        </ol>
      </section>

      <label class="sr-only" for="research-input">Поле для ввода текста</label>
      <div class="input-area">
        <div class="input-shell">
          <input
            id="research-input"
            type="text"
            placeholder="Поле для ввода голосом"
            autocomplete="off"
            autocapitalize="sentences"
            enterkeyhint="done"
          />
          <button type="button" aria-label="Очистить поле" disabled>×</button>
        </div>
      </div>
    </main>

    <script>
      const input = document.querySelector("input");
      const clearButton = document.querySelector("button");
      const viewport = window.visualViewport;
      let frame = 0;

      const syncViewport = () => {
        if (viewport) {
          cancelAnimationFrame(frame);
          frame = requestAnimationFrame(() => {
            document.documentElement.style.setProperty(
              "--visual-viewport-top",
              `${viewport.offsetTop}px`,
            );
            document.documentElement.style.setProperty(
              "--visual-viewport-height",
              `${viewport.height}px`,
            );
          });
        }
      };

      const syncClearButton = () => {
        clearButton.disabled = !input.value;
      };

      syncViewport();
      viewport?.addEventListener("resize", syncViewport);
      viewport?.addEventListener("scroll", syncViewport);
      input.addEventListener("input", syncClearButton);
      input.addEventListener("pointerdown", (event) => {
        if (document.activeElement !== input) {
          event.preventDefault();
          input.focus({ preventScroll: true });
        }
      });
      clearButton.addEventListener("pointerdown", (event) => event.preventDefault());
      clearButton.addEventListener("click", () => {
        input.value = "";
        syncClearButton();
        input.focus({ preventScroll: true });
      });
    </script>
  </body>
</html>
